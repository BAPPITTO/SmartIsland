org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36
kotlin.code.style=official

# CRITICAL: AGP 9.0+ enables built-in Kotlin by default, which is incompatible 
# with the legacy 'org.jetbrains.kotlin.kapt' plugin. 
# We must disable it to allow Hilt's annotation processing to function.
android.builtInKotlin=false
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

[versions]
agp = "9.4.1"
kotlin = "2.1.20"
hilt = "2.60.1"
baselineprofile = "1.5.0"
compose-bom = "2024.12.01"
activity-compose = "1.10.0"
core-ktx = "1.15.0"
datastore = "1.1.1"
lifecycle = "2.8.7"
profileinstaller = "1.4.1"
shizuku = "13.1.5"
hiddenapibypass = "6.1"
junit = "4.13.2"
mockk = "1.13.12"
coroutines = "1.8.1"
turbine = "1.1.0"
json = "20240303"
test-ext-junit = "1.2.1"
espresso = "3.6.1"

[libraries]
# AndroidX Core
"androidx.activity.compose" = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
"androidx.core.ktx" = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
"androidx.datastore.preferences" = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
"androidx.lifecycle.runtime.ktx" = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
"androidx.lifecycle.service" = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
"androidx.lifecycle.viewmodel.compose" = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
"androidx.profileinstaller" = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

# Compose BOM & Components (Versions managed by BOM, no version.ref needed)
"compose.bom" = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
"androidx.compose.animation" = { module = "androidx.compose.animation:animation" }
"androidx.compose.foundation" = { module = "androidx.compose.foundation:foundation" }
"androidx.compose.material3" = { module = "androidx.compose.material3:material3" }
"androidx.compose.material.icons.extended" = { module = "androidx.compose.material:material-icons-extended" }
"androidx.compose.ui" = { module = "androidx.compose.ui:ui" }
"androidx.compose.ui.tooling.preview" = { module = "androidx.compose.ui:ui-tooling-preview" }
"androidx.compose.ui.tooling" = { module = "androidx.compose.ui:ui-tooling" }
"androidx.compose.ui.test.junit4" = { module = "androidx.compose.ui:ui-test-junit4" }
"androidx.compose.ui.test.manifest" = { module = "androidx.compose.ui:ui-test-manifest" }

# Hilt
"hilt.android" = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
"hilt.compiler" = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

# Third Party
"shizuku.api" = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
"shizuku.provider" = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }
"hiddenapibypass" = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapibypass" }

# Testing
"junit" = { module = "junit:junit", version.ref = "junit" }
"mockk" = { module = "io.mockk:mockk", version.ref = "mockk" }
"kotlinx.coroutines.test" = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
"turbine" = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
"json" = { module = "org.json:json", version.ref = "json" }
"androidx.test.ext.junit" = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
"androidx.test.espresso.core" = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
baselineprofile = { id = "androidx.baselineprofile", version.ref = "baselineprofile" }
